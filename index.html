<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inbox Meme Studio</title><link rel="stylesheet" href="style.css?v=3"></head><body><div id="studio"><header class="toolbar"><b>Inbox Meme Studio</b><span>Make a conversation. Play both sides.</span><button id="layout">Compact window</button><button id="clean">Clean screenshot</button><button id="settings">Edit conversation</button></header><main id="canvas"><aside><h2><span class="reddit">●</span> Chats <small>♧ ☏ ☷ ⌄</small></h2><div class="threads">↶ &nbsp; Threads <span>›</span></div><div class="contact"><img class="avatar receiver"><div><strong class="receiver-name"></strong><p id="preview">You: hi</p></div><time class="last-time">2:01 AM</time></div></aside><section id="chat"><header class="chat-head"><img class="avatar receiver"><b class="receiver-name"></b><nav><button id="gear" aria-label="Conversation settings">⚙</button><button id="expand" aria-label="Toggle full window">↗</button><button id="minimize" aria-label="Minimize">⌄</button><button id="close" aria-label="Close compact window">×</button></nav></header><div id="history"><div class="profile"><img class="avatar receiver"><b class="receiver-name"></b><p id="bio"></p></div><div id="messages"></div></div><form id="composer"><textarea id="message" rows="1" placeholder="Message" aria-label="Message"></textarea><button aria-label="Send message" id="send">➤</button></form></section></main><footer class="controls"><span>Sending as</span><button id="person0" class="selected"></button><button id="person1"></button><span>Click a message to edit or delete it.</span><button id="download">Save conversation</button><label class="import">Load conversation<input type="file" id="load" accept="application/json"></label></footer></div><button id="restore" hidden>Show editor</button><dialog id="editor"><form method="dialog"><h2>Conversation settings</h2><p class="hint">A local meme simulator. Not affiliated with Reddit.</p><div class="fields"><label>Your username<input id="name0" maxlength="50"></label><label>Other username<input id="name1" maxlength="50"></label><label>Your avatar<input id="avatar0" type="file" accept="image/*"></label><label>Other avatar<input id="avatar1" type="file" accept="image/*"></label><label>Profile text<input id="profileText" maxlength="150"></label><label>Day label<input id="dayLabel" maxlength="60"></label><label>Message time<input id="msgTime" placeholder="2:01 AM" maxlength="30"></label></div><p>Names and avatars update existing messages too.</p><div class="actions"><button type="button" id="clear">Clear messages</button><button value="save">Done</button></div></form></dialog><dialog id="editMessage"><form method="dialog"><h2>Edit message</h2><textarea id="editText" rows="4"></textarea><label>Time<input id="editTime"></label><div class="actions"><button type="button" id="deleteMessage">Delete</button><button>Save</button></div></form></dialog><script src="app.js?v=3"></script></body></html>
